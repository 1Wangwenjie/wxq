<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星愿 · Starlit Christmas</title>
  <style>
    /* ==========================================================================
       Base Reset & Luxury Velvet Night Theme Variables
       ========================================================================== */
    :root {
      --bg-deep: #040408;
      --bg-mid: #0c0914;
      --text-primary: #f7ecee;
      --text-secondary: rgba(242, 228, 231, 0.78);
      --text-muted: rgba(228, 214, 218, 0.5);
      --pill-bg: rgba(14, 13, 22, 0.76);
      --pill-border: rgba(255, 255, 255, 0.12);
      --slider-bg: linear-gradient(135deg, #edd0d4 0%, #dfb8be 100%);
      --slider-shadow: 0 4px 18px rgba(232, 194, 200, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.65);
      --active-pill-text: #191216;
      --font-serif-en: 'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', 'Times New Roman', serif;
      --font-serif-cn: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'Georgia', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body[data-theme="snow"] {
      --slider-bg: linear-gradient(135deg, #e2f3fc 0%, #c4e3f6 100%);
      --slider-shadow: 0 4px 18px rgba(182, 224, 250, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      --active-pill-text: #0e1c28;
    }

    body[data-theme="aurora"] {
      --slider-bg: linear-gradient(135deg, #bdf6e4 0%, #86dfc8 100%);
      --slider-shadow: 0 4px 18px rgba(126, 232, 204, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      --active-pill-text: #08201c;
    }

    body[data-theme="rose"] {
      --slider-bg: linear-gradient(135deg, #f5ced9 0%, #e6b2c2 100%);
      --slider-shadow: 0 4px 18px rgba(242, 180, 202, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      --active-pill-text: #221018;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    /* Fullscreen 3D Canvas */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #scene:active {
      cursor: grabbing;
    }

    /* ==========================================================================
       Clean-Screen Mode Transitions
       ========================================================================== */
    .ui-layer {
      transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1), transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.clean-mode .top-bar {
      opacity: 0;
      transform: translateY(-14px);
      pointer-events: none;
    }

    body.clean-mode .mode-switcher {
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
    }

    body.clean-mode .blessing-block {
      transform: translateY(34px);
    }

    .restore-ui-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: 16px;
      z-index: 35;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(14, 14, 22, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(248, 238, 240, 0.88);
      font-family: var(--font-serif-cn);
      font-size: 11.5px;
      letter-spacing: 0.08em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
      transition: all 0.3s ease;
    }

    body.clean-mode .restore-ui-btn {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .restore-ui-btn:hover {
      background: rgba(28, 26, 42, 0.85);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* ==========================================================================
       Top Minimal Header & Interactive Pill Controls
       ========================================================================== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: max(16px, env(safe-area-inset-top, 16px)) 16px 10px;
      pointer-events: none;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-title {
      font-family: var(--font-serif-cn);
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 600;
      letter-spacing: 0.22em;
      color: rgba(246, 232, 235, 0.92);
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255, 224, 230, 0.32);
      white-space: nowrap;
    }

    .brand-subtitle {
      font-family: var(--font-serif-cn);
      font-size: clamp(10px, 2.1vw, 11.5px);
      letter-spacing: 0.13em;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      max-width: 60%;
      pointer-events: auto;
    }

    .glass-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15, 14, 24, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: rgba(244, 234, 237, 0.88);
      font-family: var(--font-serif-cn);
      font-size: 11px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.38);
      white-space: nowrap;
    }

    .glass-chip:hover {
      background: rgba(28, 26, 42, 0.88);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .glass-chip:active {
      transform: scale(0.95);
    }

    .glass-chip.is-active {
      background: rgba(232, 206, 212, 0.22);
      border-color: rgba(240, 212, 218, 0.5);
      color: #fff6f8;
      box-shadow: 0 0 18px rgba(232, 198, 206, 0.26);
    }

    .chip-dot {
      width: 5.5px;
      height: 5.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      transition: all 0.25s ease;
    }

    .glass-chip.is-active .chip-dot {
      background: #9ef0ff;
      box-shadow: 0 0 8px #9ef0ff;
    }

    /* Animated equaliser bars when music box is playing */
    .music-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 10px;
      width: 9px;
    }

    .music-bars span {
      display: block;
      width: 2px;
      height: 3px;
      border-radius: 1px;
      background: rgba(255, 255, 255, 0.45);
      transition: height 0.2s ease, background 0.2s ease;
    }

    .glass-chip.is-active .music-bars span {
      background: #ffd9e2;
      animation: eqPulse 0.9s ease-in-out infinite alternate;
    }

    .glass-chip.is-active .music-bars span:nth-child(2) {
      animation-delay: 0.25s;
    }

    .glass-chip.is-active .music-bars span:nth-child(3) {
      animation-delay: 0.5s;
    }

    @keyframes eqPulse {
      0% { height: 3px; }
      100% { height: 10px; }
    }

    /* ==========================================================================
       Bottom Editorial Blessing & 4-Mode Sliding Frosted Glass Switcher
       ========================================================================== */
    .bottom-stage {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 14px max(16px, env(safe-area-inset-bottom, 16px));
      pointer-events: none;
    }

    .blessing-block {
      text-align: center;
      margin-bottom: clamp(12px, 2.2vh, 20px);
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .blessing-block:hover {
      transform: translateY(-2px);
    }

    .blessing-main {
      font-family: var(--font-serif-en);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(28px, 6.8vw, 44px);
      line-height: 1.1;
      letter-spacing: 0.03em;
      color: #f8eaec;
      text-shadow:
        0 0 24px rgba(246, 210, 218, 0.42),
        0 2px 12px rgba(0, 0, 0, 0.75);
      transition: color 0.6s ease, text-shadow 0.6s ease;
    }

    body[data-theme="snow"] .blessing-main {
      color: #eef8ff;
      text-shadow: 0 0 24px rgba(176, 224, 255, 0.45), 0 2px 12px rgba(0, 0, 0, 0.75);
    }

    body[data-theme="aurora"] .blessing-main {
      color: #e8fff8;
      text-shadow: 0 0 24px rgba(124, 242, 208, 0.45), 0 2px 12px rgba(0, 0, 0, 0.75);
    }

    .blessing-cn {
      margin-top: 5px;
      font-family: var(--font-serif-cn);
      font-size: clamp(13px, 3vw, 15.5px);
      font-weight: 400;
      letter-spacing: 0.24em;
      color: rgba(242, 228, 231, 0.88);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
    }

    .blessing-sub {
      margin-top: 6px;
      font-family: var(--font-serif-en);
      font-size: clamp(8.5px, 1.9vw, 10px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(230, 216, 220, 0.52);
    }

    /* Bottom Dark Frosted Glass Pill Bar with Sliding Indicator */
    .mode-switcher {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100%;
      max-width: 448px;
      padding: 5px;
      border-radius: 18px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      pointer-events: auto;
    }

    .mode-slider {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 5px;
      width: calc((100% - 10px) / 4);
      border-radius: 13px;
      background: var(--slider-bg);
      box-shadow: var(--slider-shadow);
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), background 0.45s ease, box-shadow 0.45s ease;
      z-index: 1;
      pointer-events: none;
    }

    .mode-btn {
      position: relative;
      z-index: 2;
      border: none;
      border-radius: 13px;
      padding: 10px 4px;
      background: transparent;
      color: rgba(236, 224, 227, 0.74);
      font-family: var(--font-serif-cn);
      font-size: clamp(11.5px, 2.8vw, 13px);
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 0.3s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .mode-btn:hover:not(.active) {
      color: #ffffff;
    }

    .mode-btn:active {
      transform: scale(0.96);
    }

    .mode-btn.active {
      color: var(--active-pill-text);
      font-weight: 600;
    }

    /* ==========================================================================
       Custom Blessing Modal with One-Tap Presets
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(4, 4, 8, 0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      padding: 22px 20px 18px;
      border-radius: 22px;
      background: rgba(18, 16, 27, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 26px 64px rgba(0, 0, 0, 0.8);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-title {
      font-family: var(--font-serif-cn);
      font-size: 15px;
      letter-spacing: 0.16em;
      color: #f7e9eb;
      margin-bottom: 12px;
      text-align: center;
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .preset-chip {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(240, 226, 230, 0.82);
      font-family: var(--font-serif-cn);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-chip:hover {
      background: rgba(232, 198, 206, 0.22);
      border-color: rgba(232, 198, 206, 0.45);
      color: #fff;
    }

    .field-group {
      margin-bottom: 11px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .field-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: rgba(8, 8, 14, 0.78);
      color: #fff7f8;
      font-family: var(--font-serif-cn);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s ease;
      user-select: text;
    }

    .field-input:focus {
      border-color: rgba(238, 200, 208, 0.6);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      font-family: var(--font-serif-cn);
      font-size: 13px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn:hover {
      background: rgba(255, 255, 255, 0.11);
      color: #fff;
    }

    .modal-btn.primary {
      background: #e6c6ca;
      color: #191216;
      border-color: transparent;
      font-weight: 600;
    }

    .modal-btn.primary:hover {
      background: #f0d5d8;
    }

    /* Subtle First-Load Gesture Hint */
    .gesture-hint {
      position: fixed;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(14, 13, 22, 0.64);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(244, 232, 235, 0.8);
      font-family: var(--font-serif-cn);
      font-size: 11.5px;
      letter-spacing: 0.12em;
      pointer-events: none;
      opacity: 0;
      animation: hintFade 4.8s ease 0.7s forwards;
      white-space: nowrap;
    }

    @keyframes hintFade {
      0% { opacity: 0; transform: translate(-50%, -42%); }
      18% { opacity: 1; transform: translate(-50%, -50%); }
      78% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -56%); }
    }
  </style>
</head>
<body data-theme="ribbon">

  <!-- Fullscreen 3D Particle & Aurora Canvas -->
  <canvas id="scene"></canvas>

  <!-- Restore UI Floating Pill (Visible in Clean-Screen Mode) -->
  <button id="restoreUiBtn" class="restore-ui-btn" type="button" aria-label="显示界面">
    <span>👁 显示界面</span>
  </button>

  <!-- Top Minimal Header & Interactive Controls -->
  <header class="top-bar ui-layer">
    <div class="brand-header">
      <div class="brand-title">星愿 · STARLIT CHRISTMAS</div>
      <div class="brand-subtitle">愿以星河为引，点亮冬日奇迹</div>
    </div>
    <div class="top-actions">
      <button id="snowToggleBtn" class="glass-chip is-active" type="button" aria-label="切换飘雪">
        <span class="chip-dot"></span>
        <span>❄ 飘雪</span>
      </button>
      <button id="ribbonToggleBtn" class="glass-chip is-active" type="button" aria-label="切换灯条">
        <span class="chip-dot"></span>
        <span>💡 灯条</span>
      </button>
      <button id="musicBtn" class="glass-chip" type="button" aria-label="八音盒音乐">
        <span class="music-bars" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>🎵 八音盒</span>
      </button>
      <button id="wishBtn" class="glass-chip" type="button" aria-label="许愿流星">
        <span>🌠 许愿</span>
      </button>
      <button id="editBlessingBtn" class="glass-chip" type="button" aria-label="自定义寄语">
        <span>✎ 寄语</span>
      </button>
      <button id="cleanModeBtn" class="glass-chip" type="button" aria-label="纯净模式">
        <span>👁 纯净</span>
      </button>
    </div>
  </header>

  <!-- Subtle First-Load Gesture Hint -->
  <div class="gesture-hint">滑动旋转圣诞树 · 点击绽放星愿烟花</div>

  <!-- Bottom Editorial Typography & 4-Theme Sliding Switcher -->
  <footer class="bottom-stage">
    <div id="blessingTrigger" class="blessing-block ui-layer" title="点击自定义节日寄语">
      <h1 id="blessingTitle" class="blessing-main">Merry Christmas</h1>
      <p id="blessingCn" class="blessing-cn">愿所有美好，如期而至</p>
      <p id="blessingSub" class="blessing-sub">✦ MAY YOUR WISHES FIND THEIR LIGHT ✦</p>
    </div>

    <nav class="mode-switcher ui-layer" aria-label="圣诞树样式切换">
      <div id="modeSlider" class="mode-slider"></div>
      <button class="mode-btn active" data-mode="ribbon" data-index="0" type="button">星愿灯条</button>
      <button class="mode-btn" data-mode="snow" data-index="1" type="button">初雪覆松</button>
      <button class="mode-btn" data-mode="aurora" data-index="2" type="button">极光幻梦</button>
      <button class="mode-btn" data-mode="rose" data-index="3" type="button">柔粉星梦</button>
    </nav>
  </footer>

  <!-- Custom Blessing Editor Modal -->
  <div id="blessingModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
    <div class="modal-card">
      <div id="modalHeading" class="modal-title">✦ 定制专属圣诞寄语 ✦</div>
      <div class="preset-row">
        <button class="preset-chip" type="button" data-title="Merry Christmas" data-cn="愿所有美好，如期而至" data-sub="✦ MAY YOUR WISHES FIND THEIR LIGHT ✦">星愿经典</button>
        <button class="preset-chip" type="button" data-title="Winter Magic" data-cn="初雪落满枝头，浪漫不期而遇" data-sub="✦ LET IT SNOW · WINTER WONDERLAND ✦">初雪浪漫</button>
        <button class="preset-chip" type="button" data-title="Starlit Wishes" data-cn="岁岁常欢愉，万事皆胜意" data-sub="✦ PEACE · JOY · ENDLESS WONDER ✦">岁岁欢愉</button>
        <button class="preset-chip" type="button" data-title="For You" data-cn="见字如晤，圣诞快乐" data-sub="✦ WARMEST WISHES THIS WINTER NIGHT ✦">专属心意</button>
      </div>
      <div class="field-group">
        <label class="field-label" for="inputTitle">英文 / 主标题</label>
        <input id="inputTitle" class="field-input" type="text" maxlength="32" value="Merry Christmas" />
      </div>
      <div class="field-group">
        <label class="field-label" for="inputCn">中文祝福语</label>
        <input id="inputCn" class="field-input" type="text" maxlength="28" value="愿所有美好，如期而至" />
      </div>
      <div class="field-group">
        <label class="field-label" for="inputSub">星愿副标</label>
        <input id="inputSub" class="field-input" type="text" maxlength="46" value="✦ MAY YOUR WISHES FIND THEIR LIGHT ✦" />
      </div>
      <div class="modal-actions">
        <button id="closeModalBtn" class="modal-btn" type="button">取消</button>
        <button id="saveBlessingBtn" class="modal-btn primary" type="button">保存寄语</button>
      </div>
    </div>
  </div>

  <script>
    /**
     * ==========================================================================
     * 星愿 · Starlit Christmas — Fail-Safe 3D Botanical Spruce Engine (60fps)
     * Unified Back-to-Front Painter's Algorithm + Offscreen Botanical Sprites
     * ==========================================================================
     */
    (function () {
      'use strict';

      const canvas = document.getElementById('scene');
      if (!canvas) return;
      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) return;

      // UI References
      const modeButtons = document.querySelectorAll('.mode-btn');
      const modeSlider = document.getElementById('modeSlider');
      const snowToggleBtn = document.getElementById('snowToggleBtn');
      const ribbonToggleBtn = document.getElementById('ribbonToggleBtn');
      const musicBtn = document.getElementById('musicBtn');
      const wishBtn = document.getElementById('wishBtn');

      function getGlowSprite(r, g, b, sharpness = 0.3) {
        const qr = Math.round(r / 8) * 8;
        const qg = Math.round(g / 8) * 8;
        const qb = Math.round(b / 8) * 8;
        const key = `g_${qr}_${qg}_${qb}_${sharpness}`;
        let spr = glowSpriteCache.get(key);
        if (spr) return spr;

        if (glowSpriteCache.size > 180) glowSpriteCache.clear();

        const size = 64;
        const half = size * 0.5;
        spr = document.createElement('canvas');
        spr.width = size;
        spr.height = size;
        const sctx = spr.getContext('2d');

        const grad = sctx.createRadialGradient(half, half, 0, half, half, half);
        grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grad.addColorStop(sharpness, `rgba(${qr}, ${qg}, ${qb}, 0.85)`);
        grad.addColorStop(0.65, `rgba(${qr}, ${qg}, ${qb}, 0.22)`);
        grad.addColorStop(1, `rgba(${qr}, ${qg}, ${qb}, 0)`);

        sctx.fillStyle = grad;
        sctx.fillRect(0, 0, size, size);
        glowSpriteCache.set(key, spr);
        return spr;
      }

      /**
       * Creates and caches a feathery botanical pine-needle cluster sprite
       * with individual radiating conifer needles around a woody twig spine.
       */
      function getNeedleSpraySprite(r, g, b, variant = 0) {
        const qr = Math.round(r / 6) * 6;
        const qg = Math.round(g / 6) * 6;
        const qb = Math.round(b / 6) * 6;
        const key = `n_${qr}_${qg}_${qb}_${variant}`;
        let spr = needleSpriteCache.get(key);
        if (spr) return spr;

        if (needleSpriteCache.size > 240) needleSpriteCache.clear();

        const size = 52;
        const half = size * 0.5;
        spr = document.createElement('canvas');
        spr.width = size;
        spr.height = size;
        const sctx = spr.getContext('2d');

        // Soft organic inner foliage body
        const coreGrad = sctx.createRadialGradient(half, half, 1, half, half, half * 0.62);
        coreGrad.addColorStop(0, `rgba(${Math.max(0, qr - 8)}, ${Math.max(0, qg - 8)}, ${Math.max(0, qb - 8)}, 0.94)`);
        coreGrad.addColorStop(0.68, `rgba(${qr}, ${qg}, ${qb}, 0.52)`);
        coreGrad.addColorStop(1, `rgba(${qr}, ${qg}, ${qb}, 0)`);
        sctx.fillStyle = coreGrad;
        sctx.beginPath();
        sctx.arc(half, half, half * 0.62, 0, Math.PI * 2);
        sctx.fill();

        // Central twig spine
        sctx.strokeStyle = `rgba(${Math.max(0, qr - 18)}, ${Math.max(0, qg - 20)}, ${Math.max(0, qb - 18)}, 0.85)`;
        sctx.lineWidth = 1.6;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(half * 0.35, half);
        sctx.lineTo(half * 1.65, half);
        sctx.stroke();

        // Radiating individual pine needle strokes
        const needleCount = 18;
        const tipR = Math.min(255, qr + 26);
        const tipG = Math.min(255, qg + 30);
        const tipB = Math.min(255, qb + 24);

        for (let i = 0; i < needleCount; i++) {
          const baseAngle = (i / needleCount) * Math.PI * 2 + variant * 0.42;
          const jitter = Math.sin(i * 3.7 + variant * 2.1) * 0.14;
          const a = baseAngle + jitter;
          const innerDist = 2 + (i % 3) * 1.4;
          const outerDist = half * (0.74 + 0.22 * Math.cos(i * 2.3 + variant));

          sctx.strokeStyle = i % 3 === 0
            ? `rgba(${tipR}, ${tipG}, ${tipB}, 0.94)`
            : `rgba(${qr}, ${qg}, ${qb}, 0.96)`;
          sctx.lineWidth = i % 2 === 0 ? 1.6 : 1.25;

          sctx.beginPath();
          sctx.moveTo(half + Math.cos(a) * innerDist, half + Math.sin(a) * innerDist);
          sctx.lineTo(half + Math.cos(a) * outerDist, half + Math.sin(a) * outerDist);
          sctx.stroke();
        }

        needleSpriteCache.set(key, spr);
        return spr;
      }

        sctx.restore();

        snowTuftCache.set(key, spr);
        return spr;

        curr[0] = lerp(curr[0], target[0], t);
